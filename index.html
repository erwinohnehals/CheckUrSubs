<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- ── Primary ── -->
    <title>Gold&amp;Geld</title>
    <meta name="description" content="Verträge, Versicherungen und Abos an einem Ort — mit Fristen, Dokumenten und Zugängen." />
    <meta name="theme-color" content="#F5F3EF" />

    <!-- ── Farbschema vor dem ersten Anstrich setzen, sonst blitzt es auf ── -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('goldgeld.theme');
          var dark = saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#161414' : '#F5F3EF');
        } catch (e) { /* Speicher gesperrt — helles Standardthema */ }
      })();
    </script>

    <!-- ── PWA manifest ── -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── Favicon ── -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- ── iOS / Apple ── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gold&amp;Geld" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── OG / Social ── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gold&amp;Geld" />
    <meta property="og:description" content="Verträge, Versicherungen und Abos an einem Ort — mit Fristen, Dokumenten und Zugängen." />
    <meta property="og:url" content="https://gold-und-geld.vercel.app" />
    <meta property="og:image" content="https://gold-und-geld.vercel.app/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gold&amp;Geld" />
    <meta name="twitter:description" content="Verträge, Versicherungen und Abos an einem Ort — mit Fristen, Dokumenten und Zugängen." />
    <meta name="twitter:image" content="https://gold-und-geld.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
